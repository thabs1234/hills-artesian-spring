<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C542" />
      <stop offset="0.5" stop-color="#F2A900" />
      <stop offset="1" stop-color="#C8760A" />
    </linearGradient>
    <linearGradient id="blackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2118" />
      <stop offset="1" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B35" />
      <stop offset="1" stop-color="#E55A00" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="16" fill="url(#blackGrad)" />

  <!-- Decorative water ripple -->
  <g opacity="0.08">
    <circle cx="100" cy="360" r="70" fill="#F2A900" />
    <circle cx="380" cy="120" r="45" fill="#F2A900" />
    <circle cx="240" cy="300" r="35" fill="#F2A900" />
  </g>

  <!-- Water surface (spring) -->
  <ellipse cx="256" cy="340" rx="90" ry="6" fill="#F2A900" opacity="0.3" />

  <!-- Mountain / Hills silhouettes (taller, dramatic) -->
  <!-- Mid hills (soft gold) -->
  <path d="M0,512 L0,390 Q50,375 100,395 Q150,360 200,390 Q250,368 300,400 Q350,378 400,410 Q450,385 512,400 L512,512 Z" fill="#D4AF37" opacity="0.18" />
  <!-- Foreground hills (gold gradient) -->
  <path d="M0,512 L0,350 Q60,335 120,355 Q180,310 240,345 Q300,300 360,360 Q420,325 480,365 L512,380 L512,512 Z" fill="url(#goldGrad)" opacity="0.5" />
  <!-- Background hills (soft gold) -->
  <path d="M0,512 L0,370 Q80,355 160,375 Q240,340 320,370 Q400,350 480,380 L512,400 L512,512 Z" fill="#E6C24A" opacity="0.2" />

  <!-- Hill peaks (gold rings) -->
  <circle cx="240" cy="355" r="8" fill="#F2A900" opacity="0.5" />
  <circle cx="240" cy="355" r="4" fill="#D4AF37" />

  <!-- Water droplet / spring symbol (orange) -->
  <g transform="translate(256, 290)">
    <!-- Drop outline -->
    <path d="M-20,8 C-20,-12 20,-12 20,8 C20,28 -20,28 -20,8 Z" fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.4" />
    <!-- Water droplet shape (orange) -->
    <path d="M-18,6 C-18,-10 18,-10 18,6 C18,22 -18,22 -18,6 Z" fill="url(#orangeGrad)" opacity="0.9" />
    <!-- Highlight -->
    <ellipse cx="-6" cy="3" rx="5" ry="2" fill="#FFD54F" opacity="0.6" />
  </g>

  <!-- Spring water sparkle -->
  <g opacity="0.7">
    <line x1="220" y1="260" x2="232" y2="272" stroke="#F2A900" stroke-width="0.5" />
    <line x1="290" y1="260" x2="278" y2="272" stroke="#F2A900" stroke-width="0.5" />
    <line x1="256" y1="240" x2="262" y2="252" stroke="#FFD54F" stroke-width="0.5" />
  </g>

  <!-- Brand wordmark (Hills Spring) -->
  <text x="256" y="390" text-anchor="middle" font-family="'Cormorant', Georgia, serif" font-size="42" font-weight="600" fill="#FFFFFF">
    <tspan fill="#F2A900">H</tspan><tspan fill="#F2A900">I</tspan><tspan fill="#F2A900">L</tspan><tspan fill="#F2A900">L</tspan>S
  </text>
  <text x="256" y="420" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#F2A900" letter-spacing="5">
    SPRING WATER
  </text>

  <!-- Bottom accent strip -->
  <rect x="20" y="465" width="472" height="3" rx="1.5" fill="#F2A900" opacity="0.3" />
</svg>