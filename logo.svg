<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4AF37" />
      <stop offset="0.5" stop-color="#A16207" />
      <stop offset="1" stop-color="#8B6914" />
    </linearGradient>
    <linearGradient id="blackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2118" />
      <stop offset="1" stop-color="#1C1917" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="12" fill="url(#blackGrad)" />

  <!-- Decorative water ripple -->
  <g opacity="0.08">
    <circle cx="80" cy="300" r="60" fill="#A16207" />
    <circle cx="320" cy="100" r="40" fill="#A16207" />
    <circle cx="200" cy="250" r="30" fill="#A16207" />
  </g>

  <!-- Water surface (spring) -->
  <ellipse cx="200" cy="310" rx="80" ry="8" fill="#A16207" opacity="0.4" />
  <ellipse cx="200" cy="312" rx="60" ry="6" fill="#A16207" opacity="0.25" />

  <!-- Mountain / Hills silhouettes (3 layers) -->
  <!-- Foreground hills (gold gradient) -->
  <path d="M0,400 L0,330 Q50,320 100,340 Q150,300 200,335 Q250,310 300,345 Q350,325 400,340 L400,400 Z" fill="url(#goldGrad)" opacity="0.35" />
  <path d="M0,400 L0,310 Q60,300 120,315 Q180,285 240,310 Q300,290 360,315 Q400,300 400,310 L400,400 Z" fill="url(#goldGrad)" opacity="0.5" />

  <!-- Mid hills (soft gold) -->
  <path d="M0,400 L0,345 Q50,335 100,350 Q150,325 200,350 Q250,330 300,355 Q350,335 400,355 L400,400 Z" fill="#D4AF37" opacity="0.15" />

  <!-- Hill peaks (gold rings) -->
  <circle cx="200" cy="340" r="8" fill="#A16207" opacity="0.6" />
  <circle cx="200" cy="340" r="4" fill="#D4AF37" />

  <!-- Water drop / spring symbol (center) -->
  <g transform="translate(200, 270)">
    <!-- Drop outline -->
    <path d="M-20,10 C-20,-10 20,-10 20,10 C20,25 -20,25 -20,10 Z" fill="none" stroke="#A16207" stroke-width="1.5" opacity="0.5" />
    <!-- Water droplet shape -->
    <path d="M-15,5 C-15,-8 15,-8 15,5 C15,18 -15,18 -15,5 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Highlight -->
    <ellipse cx="-5" cy="2" rx="4" ry="2" fill="#D4AF37" opacity="0.6" />
  </g>

  <!-- Spring water sparkle -->
  <g opacity="0.7">
    <line x1="180" y1="240" x2="190" y2="250" stroke="#A16207" stroke-width="0.5" />
    <line x1="220" y1="240" x2="210" y2="250" stroke="#A16207" stroke-width="0.5" />
    <line x1="200" y1="220" x2="205" y2="230" stroke="#D4AF37" stroke-width="0.5" />
  </g>

  <!-- Brand text (Hills) -->
  <text x="200" y="365" text-anchor="middle" font-family="'Cormorant', Georgia, serif" font-size="38" font-weight="600" fill="#FFFFFF">
    H<tspan fill="#A16207">I</tspan>L<tspan fill="#A16207">L</tspan>S
  </text>

  <!-- Brand tagline -->
  <text x="200" y="395" text-anchor="middle" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#E8ECF0" letter-spacing="3">
    ARTESIAN SPRING WATER
  </text>
</svg>