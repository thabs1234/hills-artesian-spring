<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800' width='600' height='800'>
  <defs>
    <linearGradient id='bottleGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#E8E4DF'/>
      <stop offset='0.5' stop-color='#D4CCC4'/>
      <stop offset='1' stop-color='#B8B0A5'/>
    </linearGradient>
    <linearGradient id='frostGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#F5F5F5'/>
      <stop offset='0.5' stop-color='#E0E0E0'/>
      <stop offset='1' stop-color='#C8C8C8'/>
    </linearGradient>
    <linearGradient id='liquidGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#F5C542'/>
      <stop offset='1' stop-color='#C8760A'/>
    </linearGradient>
    <linearGradient id='shadowGrad' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='rgba(0,0,0,0.2)'/>
      <stop offset='1' stop-color='rgba(0,0,0,0.4)'/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width='600' height='800' fill='#1C1917' rx='20' ry='20'/>

  <!-- Ice texture - crystalline frost -->
  <g opacity='0.7'>
    <!-- Ice crystals -->
    <path d='M150,300 L158,320 L150,340 L142,320 Z' fill='#FFFFFF' opacity='0.6'/>
    <path d='M165,320 L172,335 L165,350 L158,335 Z' fill='#FFFFFF' opacity='0.5'/>
    <path d='M178,330 L185,345 L178,360 L171,345 Z' fill='#FFFFFF' opacity='0.4'/>
    <path d='M155,310 L160,325 L155,340 L150,325 Z' fill='#FFFFFF' opacity='0.5'/>
    <path d='M172,338 L177,352 L172,367 L167,352 Z' fill='#FFFFFF' opacity='0.4'/>
  </g>

  <!-- Water droplets on bottle -->
  <g opacity='0.6'>
    <circle cx='155' cy='380' r='3' fill='#FFFFFF' opacity='0.8'/>
    <circle cx='170' cy='400' r='2' fill='#FFFFFF' opacity='0.6'/>
    <circle cx='185' cy='420' r='2.5' fill='#FFFFFF' opacity='0.7'/>
    <circle cx='160' cy='440' r='2' fill='#FFFFFF' opacity='0.5'/>
    <circle cx='175' cy='460' r='1.5' fill='#FFFFFF' opacity='0.6'/>
  </g>

  <!-- Bottle body -->
  <path d='M120,800 L120,550 Q120,480 150,450 Q180,420 200,380 L400,380 Q420,420 450,450 Q480,480 480,550 L480,800 Z' fill='url(#bottleGrad)'/>

  <!-- Bottle neck -->
  <rect x='160' y='320' width='280' height='80' rx='10' fill='url(#bottleGrad)'/>

  <!-- Bottle cap -->
  <rect x='165' y='300' width='270' height='30' rx='5' fill='#8B6914'/>
  <rect x='170' y='295' width='260' height='10' rx='5' fill='#A16207'/>
  <rect x='175' y='285' width='250' height='10' rx='5' fill='#D4AF37'/>

  <!-- Bottle label -->
  <rect x='185' y='380' width='230' height='200' rx='8' fill='rgba(0,0,0,0.2)'/>
  <rect x='185' y='380' width='230' height='200' rx='8' fill='url(#frostGrad)' opacity='0.3'/>

  <!-- Water inside bottle -->
  <rect x='170' y='350' width='260' height='150' rx='10' fill='url(#liquidGrad)' opacity='0.8'/>

  <!-- Ice crystals inside bottle -->
  <g opacity='0.4'>
    <path d='M175,420 L180,435 L175,450 L170,435 Z' fill='#FFFFFF'/>
    <path d='M190,430 L195,445 L190,460 L185,445 Z' fill='#FFFFFF'/>
    <path d='M205,440 L210,455 L205,470 L200,455 Z' fill='#FFFFFF'/>
  </g>

  <!-- Frost shimmer -->
  <g opacity='0.5'>
    <rect x='160' y='330' width='280' height='80' rx='10' fill='#FFFFFF' opacity='0.1'/>
    <rect x='160' y='330' width='280' height='80' rx='10' fill='#FFFFFF' opacity='0.08' transform='rotate(-5, 300, 370)'/>
  </g>

  <!-- Soft shadow under bottle -->
  <ellipse cx='300' cy='810' rx='180' ry='15' fill='url(#shadowGrad)'/>

  <!-- Condensation -->
  <g opacity='0.5'>
    <circle cx='150' cy='600' r='2' fill='#FFFFFF' opacity='0.7'/>
    <circle cx='160' cy='620' r='1.5' fill='#FFFFFF' opacity='0.5'/>
    <circle cx='170' cy='640' r='2' fill='#FFFFFF' opacity='0.6'/>
    <circle cx='180' cy='660' r='1.5' fill='#FFFFFF' opacity='0.4'/>
    <circle cx='190' cy='680' r='2' fill='#FFFFFF' opacity='0.5'/>
  </g>

  <!-- Water particle animation -->
  <g opacity='0.6'>
    <!-- Ice crystal growth animation -->
    <path d='M200,380 L205,395 L200,410 L195,395 Z' fill='#FFFFFF'>
      <animate attributeName='opacity' values='0.4;0.8;0.4' dur='3s' repeatCount='indefinite'/>
    </path>
    <path d='M220,390 L225,405 L220,420 L215,405 Z' fill='#FFFFFF'>
      <animate attributeName='opacity' values='0.3;0.7;0.3' dur='4s' repeatCount='indefinite'/>
    </path>
    <path d='M185,400 L190,415 L185,430 L180,415 Z' fill='#FFFFFF'>
      <animate attributeName='opacity' values='0.5;0.9;0.5' dur='3.5s' repeatCount='indefinite'/>
    </path>
  </g>

  <!-- Droplet animation -->
  <g>
    <circle cx='155' cy='370' r='1.5' fill='#FFFFFF'>
      <animate attributeName='cy' from='370' to='600' dur='4s' repeatCount='indefinite'/>
      <animate attributeName='opacity' values='0.8;0;0.8' dur='4s' repeatCount='indefinite'/>
    </circle>
    <circle cx='170' cy='390' r='1.5' fill='#FFFFFF'>
      <animate attributeName='cy' from='390' to='600' dur='5s' repeatCount='indefinite'/>
      <animate attributeName='opacity' values='0.7;0;0.7' dur='5s' repeatCount='indefinite'/>
    </circle>
    <circle cx='185' cy='410' r='1.5' fill='#FFFFFF'>
      <animate attributeName='cy' from='410' to='600' dur='4.5s' repeatCount='indefinite'/>
      <animate attributeName='opacity' values='0.6;0;0.6' dur='4.5s' repeatCount='indefinite'/>
    </circle>
  </g>
</svg>